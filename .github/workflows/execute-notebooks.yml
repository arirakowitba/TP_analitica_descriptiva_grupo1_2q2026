name: Ejecutar notebooks secuencialmente

on:
  push:
    branches: [main]
    paths:
      - "run-notebooks-validation.txt"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  execute-notebooks:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v7
        with:
          ref: main
      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml
      - name: Instalar dependencias
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Comprobar instalación e importaciones sin PYTHONPATH
        run: python -m unittest discover -s tests -v
      - name: Ejecutar notebooks 01 a 15
        run: python -m src.run_notebooks_sequential
      - name: Guardar notebooks y registro aunque haya error
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: notebooks-ejecutados
          path: notebooks/*.ipynb
          retention-days: 7
      - name: Guardar outputs ejecutados en main
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add notebooks/*.ipynb
          if ! git diff --cached --quiet; then
            git commit -m "ejecuta notebooks 01 a 15 en secuencia"
            git push origin HEAD:main
          fi
