name: Ejecutar notebooks secuencialmente

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  execute-notebooks:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v7
      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            constraints.txt
            pyproject.toml
      - name: Instalar dependencias
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Comprobar instalación e importaciones sin PYTHONPATH
        run: python -m unittest discover -s tests -v
      - name: Ejecutar notebooks 01 a 16
        run: python -m src.run_notebooks_sequential
      - name: Retirar salidas obsoletas enumeradas
        run: python -m src.depurar_processed --apply
      - name: Verificar mart y coherencia final
        run: python -m src.validar_cierre
      - name: Guardar notebooks y registro aunque haya error
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: notebooks-ejecutados
          path: |
            notebooks/*.ipynb
            data/processed/reports/
            data/processed/dashboard_mart/powerbi/
          retention-days: 7
